spring.application.name=resafacile

# Port du serveur
server.port=9090
# Nos propriétes dans le code aec les values
resafacile.nom=Resafacile
resafacile.version-serie=Episode2

# Ep05 : connexion à MySQL
# Chaque valeur peut être remplacée par une variable d'environnement
# (DB_URL, DB_USER, DB_PASSWORD) sans toucher au code.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resafacile}
spring.datasource.username=${DB_USER:resafacile}
spring.datasource.password=${DB_PASSWORD:resafacile_dev}

# Hibernate crée / met à jour les tables à partir des @Entity (pratique en dev)
spring.jpa.hibernate.ddl-auto=update
# Affiche les requêtes SQL dans la console pour comprendre ce qui se passe
spring.jpa.show-sql=true
